<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Open Graph / social card. 1200×630. This file is the one place a
       selectable-text rule does not apply: it is a picture of the product,
       rendered outside the page's type system. Palette is the dark scheme's
       (ink #0b0c0e, bone #f5f2ea, press green #47c99a). -->
  <defs>
    <style>
      .serif { font-family: "Sitka Heading", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
      .sans { font-family: "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0b0c0e" />
  <rect x="24" y="24" width="1152" height="582" rx="2" fill="none" stroke="#4a4640" stroke-width="1.5" />

  <!-- corner registration marks -->
  <g fill="none" stroke="#6f6a62" stroke-width="1.5" stroke-linecap="round">
    <path d="M50 62V50h12M1138 50h12v12M1150 568v12h-12M62 580H50v-12" />
    <path d="M50 86v6M1114 50h6M1150 544v6M86 580h6" stroke-width="1" />
  </g>

  <!-- wordmark -->
  <g transform="translate(72 56)">
    <rect width="32" height="32" rx="7" fill="#0b0c0e" stroke="#6f7a74" stroke-width="1" />
    <path d="M8.5 4.5h9.5l5.5 5.5v17.5h-15z" fill="#fffdf9" />
    <path d="M18 4.5v5.5h5.5" fill="#d8d1c2" />
    <path d="M12.5 16.5h10M12.5 21h7" stroke="#0f5c43" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>
  <text class="sans" x="116" y="79" font-size="27" font-weight="600" letter-spacing="-0.6" fill="#f5f2ea">Applywright</text>

  <text class="mono" x="1128" y="76" text-anchor="end" font-size="13" letter-spacing="2.4" fill="#a9aeb6">CV SCORING · GROUNDED TAILORING</text>

  <!-- slogan -->
  <text class="serif" x="72" y="272" font-size="78" letter-spacing="-2.6" fill="#f5f2ea">Your numbers stay.</text>
  <text class="serif" x="72" y="362" font-size="78" letter-spacing="-2.6" fill="#f5f2ea">The wording moves.</text>

  <!-- registration rule between the slogan and the proof -->
  <g fill="none" stroke="#6f6a62" stroke-width="1" stroke-linecap="round">
    <path d="M72 402h120M232 402h168" />
    <circle cx="212" cy="402" r="5" stroke-width="1.5" />
    <path d="M212 395v14M205 402h14" stroke-width="1" />
  </g>

  <!-- one redline detail: what was, what the grounded rewrite says -->
  <rect x="72" y="430" width="1056" height="128" rx="2" fill="#14161a" stroke="#2f3238" stroke-width="1.5" />
  <text class="mono" x="96" y="460" font-size="12" letter-spacing="2.2" fill="#a9aeb6">GROUNDING CHECK · ONE BULLET</text>

  <text class="mono" x="96" y="494" font-size="19" fill="#8d929a">Responsible for checkout improvements with 2 engineers</text>
  <path d="M94 487h588" stroke="#f27268" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <text class="mono" x="96" y="528" font-size="19" fill="#d7efa6">Cut checkout drop-off 18% over 2 releases</text>
  <path d="M94 536h472" stroke="#47c99a" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <rect x="712" y="476" width="92" height="28" rx="2" fill="none" stroke="#47c99a" stroke-width="1.5" />
  <text class="mono" x="758" y="496" text-anchor="middle" font-size="14" fill="#47c99a">[CV §2]</text>

  <!-- what the check preserved, in the space the chip leaves -->
  <text class="mono" x="1104" y="476" text-anchor="end" font-size="11" letter-spacing="2" fill="#6f6a62">NUMBERS PRESERVED</text>
  <text class="mono" x="1104" y="500" text-anchor="end" font-size="16" fill="#d7efa6">18% · 2 · 2</text>

  <!-- proof line -->
  <text class="mono" x="72" y="596" font-size="15" letter-spacing="0.6" fill="#a9aeb6">Nothing invented.</text>
  <g fill="none" stroke="#47c99a" stroke-width="1.5" stroke-linecap="round">
    <path d="M252 590v10M247 595h10" />
  </g>
</svg>
